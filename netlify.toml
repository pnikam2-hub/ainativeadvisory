[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Repo documentation is in the publish root (publish = ".") — keep it out of the public site
[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
